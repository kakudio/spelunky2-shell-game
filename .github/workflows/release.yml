name: Release mod

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Ensure tag matches mod version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw mod.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag '${{ github.ref_name }}' must match mod.json version 'v$version'."
          }

      - name: Package mod
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Create GitHub release and upload archive
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip

      - name: Upload archive for manual runs
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Spelunky2-ShellGame
          path: dist/*.zip
          if-no-files-found: error

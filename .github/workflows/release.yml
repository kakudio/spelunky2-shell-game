name: Release mod

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml

  release:
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Ensure tag matches mod version
        run: |
          version=$(jq -r .version mod.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must match mod.json version 'v$version'."
            exit 1
          fi

      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: ShellGame
          path: dist/release

      - name: Create GitHub release and upload archive
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/release/ShellGame.zip
          fail_on_unmatched_files: true
